name: refresh-live-data

on:
  schedule:
    - cron: '17 * * * *'   # hourly, offset from :00 to avoid load spikes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh LIVE.md (gov feed archived 2026-10-21)
        run: |
          cat > LIVE.md <<'MD'
          # GovContract Radar — Live Data Feed

          > **This product line was retired from pixharvest-engine on 2026-10-21.**
          > The `/api/gov/today.json` endpoint now returns an archived marker
          > (`{"archived": true, "opportunities": []}`) for downstream compatibility.
          > Historical data and the example integrations in [examples/](examples/) remain valid.

          *This file is kept for link stability. Demand signals live in [DEMAND.md](DEMAND.md).*
          MD

      - name: Generate DEMAND.md (HN demand signals)
        run: python3 scripts/demand_intel.py

      - name: Commit & push
        run: |
          git config user.name "PixHarvest Bot"
          git config user.email "contact@pixharvest.com"
          git add LIVE.md DEMAND.md
          git diff --cached --quiet || git commit -m "chore: refresh demand signals ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:main
